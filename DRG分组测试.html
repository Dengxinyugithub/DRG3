<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHS-DRG 3.0 分组测试</title>
<style>
  :root{
    --ink:#102a43; --ink-soft:#526b7d; --line:#dbe7eb; --paper:#fff;
    --teal:#0f8f83; --teal-dark:#0a6f66; --teal-soft:#e8f7f4;
    --navy:#12304a; --canvas:#f2f7f8; --danger:#b3261e; --warn:#8a5a00;
    --ok:#0f7b3f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:linear-gradient(120deg,#0d2b40,#123f56 60%,#0f6f68);color:#fff;padding:22px 20px}
  .wrap{max-width:1180px;margin:0 auto}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2ed3bf,#0b8279);display:grid;place-items:center;font-weight:800;font-size:14px}
  h1{font-size:19px;margin:0;font-weight:700}
  .sub{font-size:12.5px;opacity:.82}
  .api-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:10px;font-size:12.5px}
  .api-box input{background:rgba(255,255,255,.92);border:0;border-radius:7px;padding:5px 8px;width:210px;font-size:12.5px;color:#102a43}
  .dot{width:9px;height:9px;border-radius:50%;background:#f0b429}
  .dot.ok{background:#37d67a}.dot.bad{background:#ff6b6b}
  main{max-width:1180px;margin:18px auto 60px;padding:0 16px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:#fff;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--ink-soft)}
  .tab.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .panel{display:none}.panel.active{display:block}
  .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
  @media (max-width:960px){.grid{grid-template-columns:1fr}}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .card h2 .no{width:20px;height:20px;border-radius:6px;background:var(--teal-soft);color:var(--teal-dark);font-size:12px;display:grid;place-items:center;font-weight:700}
  .field{margin-bottom:12px;position:relative}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
  label .hint{color:#8aa0ad;font-weight:400}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:9px 11px;border:1px solid #c9d8dd;border-radius:9px;font-size:14px;
    background:#fff;color:var(--ink);font-family:inherit
  }
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,143,131,.25);border-color:var(--teal)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .row .shrink{flex:0 0 120px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:9px 0;border:1px solid #c9d8dd;background:#fff;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink)}
  .seg button.active{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-dark);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#eef4f6;border:1px solid #d7e3e7;border-radius:8px;padding:3px 8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .chip b{font-weight:600}
  .chip span.x{cursor:pointer;color:#8aa0ad;font-size:13px}
  .chip span.x:hover{color:var(--danger)}
  .dd{position:absolute;z-index:40;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(16,42,67,.14);max-height:260px;overflow:auto;display:none;margin-top:4px}
  .dd.show{display:block}
  .dd .item{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f2f6f7;font-size:13px;display:flex;gap:8px;align-items:baseline}
  .dd .item:last-child{border-bottom:0}
  .dd .item:hover,.dd .item.hl{background:var(--teal-soft)}
  .dd .code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--teal-dark);min-width:86px}
  .dd .empty{padding:9px 10px;color:#8aa0ad;font-size:13px}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button.primary{background:var(--teal);color:#fff;border:0;padding:11px 22px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer}
  button.primary:hover{background:var(--teal-dark)}
  button.primary:disabled{opacity:.6;cursor:progress}
  button.ghost{background:#fff;border:1px solid #c9d8dd;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13.5px;cursor:pointer}
  button.ghost:hover{border-color:var(--teal);color:var(--teal-dark)}
  .result{min-height:260px}
  .placeholder{color:#8aa0ad;text-align:center;padding:52px 10px;font-size:13.5px}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
  .badge.ok{background:#e6f6ec;color:var(--ok)}
  .badge.bad{background:#fdecea;color:var(--danger)}
  .badge.warn{background:#fff4e0;color:var(--warn)}
  .kv{display:grid;grid-template-columns:74px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed #e7eef1;font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft);font-size:12.5px}
  .kv .v b{font-family:ui-monospace,Consolas,monospace;color:var(--navy);margin-right:8px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px}
  .msg.warn{background:#fff8e8;border:1px solid #f3e0b5;color:#7a5300}
  .msg.bad{background:#fdecea;border:1px solid #f6cbc7;color:#8c1d18}
  .msg.ok{background:#e9f7ef;border:1px solid #c7e9d5;color:#0f6b34}
  .msg.info{background:#eef4f6;border:1px solid #d7e3e7;color:#3f5b6b}
  .card.drop-on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,143,131,.16);background:var(--teal-soft)}
  .drop-hint{border:1px dashed #c9d8dd;border-radius:10px;padding:10px 12px;color:#8aa0ad;font-size:12.5px;margin-top:10px}
  details{margin-top:12px;border-top:1px dashed #e7eef1;padding-top:10px}
  summary{cursor:pointer;font-size:12.5px;color:var(--teal-dark);font-weight:600}
  pre{margin:8px 0 0;padding:10px;background:#f6fafb;border:1px solid #e4eef1;border-radius:8px;font-size:12px;overflow:auto;max-height:320px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #e7eef1;padding:8px 6px;text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--ink-soft);font-weight:600;background:#f8fbfc}
  code.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--teal-dark)}
  textarea{min-height:210px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.5}
  .tip{font-size:12.5px;color:#8aa0ad;margin-top:6px}
  .footer{color:#8aa0ad;font-size:12px;text-align:center;margin-top:26px}
  .summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
  .summary b{font-size:16px;color:var(--teal-dark)}
  .file{display:inline-flex;align-items:center;gap:8px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo">DRG</div>
      <div>
        <h1>CHS-DRG 3.0 分组测试</h1>
        <div class="sub">本地离线分组 · 数据不出本机 · RW 暂为 NAN</div>
      </div>
    </div>
    <div class="api-box">
      <span class="dot" id="dot"></span>
      <span>服务地址</span>
      <input id="apiBase" spellcheck="false" />
      <button class="ghost" style="padding:5px 10px;font-size:12.5px" id="btnPing">检测</button>
    </div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-panel="single">单条分组</button>
    <button class="tab" data-panel="batch">批量分组</button>
  </div>

  <!-- ===================== 单条 ===================== -->
  <section class="panel active" id="panel-single">
    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <h2><span class="no">1</span>病例基本信息</h2>
          <div class="row">
            <div class="field">
              <label>患者ID <span class="hint">选填</span></label>
              <input type="text" id="patientId" placeholder="例如 345899002" />
            </div>
            <div class="field shrink">
              <label>性别</label>
              <div class="seg" id="genderSeg">
                <button data-g="M">男</button>
                <button data-g="F">女</button>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>年龄</label>
              <input type="number" id="age" min="0" step="1" placeholder="例如 65" />
            </div>
            <div class="field shrink">
              <label>年龄单位</label>
              <select id="ageUnit">
                <option value="years">岁</option>
                <option value="months">月</option>
                <option value="days">天</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>出生体重（克） <span class="hint">新生儿（≤28 天）必填，其他病例忽略</span></label>
            <input type="number" id="birthWeight" min="0" step="1" placeholder="例如 3200" />
          </div>
        </div>

        <div class="card">
          <h2><span class="no">2</span>诊断与手术操作</h2>
          <div class="field">
            <label>主要诊断 <span class="hint">输入编码或名称检索，或直接填编码</span></label>
            <div class="row">
              <input type="text" class="shrink" id="pdxCode" placeholder="编码 I63.900" autocomplete="off" />
              <input type="text" id="pdxName" placeholder="名称 脑梗死" autocomplete="off" />
            </div>
            <div class="dd" id="pdxDD"></div>
          </div>

          <div class="field">
            <label>其他诊断 <span class="hint">回车或从下拉选择添加，可多条</span></label>
            <input type="text" id="odxInput" placeholder="输入编码或名称后回车" autocomplete="off" />
            <div class="dd" id="odxDD"></div>
            <div class="chips" id="odxChips"></div>
          </div>

          <div class="field">
            <label>主要手术 / 操作 <span class="hint">没有可留空</span></label>
            <div class="row">
              <input type="text" class="shrink" id="popCode" placeholder="编码 38.1201" autocomplete="off" />
              <input type="text" id="popName" placeholder="名称 颈动脉内膜剥脱术" autocomplete="off" />
            </div>
            <div class="dd" id="popDD"></div>
          </div>

          <div class="field">
            <label>其他手术 / 操作 <span class="hint">回车或从下拉选择添加</span></label>
            <input type="text" id="oopInput" placeholder="输入编码或名称后回车" autocomplete="off" />
            <div class="dd" id="oopDD"></div>
            <div class="chips" id="oopChips"></div>
          </div>

          <div class="actions">
            <button class="primary" id="btnGroup">开始分组</button>
            <button class="ghost" id="btnSample">填充示例</button>
            <button class="ghost" id="btnClear">清空</button>
            <label class="ghost file" style="cursor:pointer">
              <input type="checkbox" id="debug" style="width:auto;margin-right:6px" />显示分组过程
            </label>
          </div>
        </div>
      </div>

      <div>
        <div class="card result" id="result">
          <div class="placeholder">填写左侧病例信息后点击「开始分组」<br />分组在本机完成，不会上传任何数据</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 批量 ===================== -->
  <section class="panel" id="panel-batch">
    <div class="card" style="margin-bottom:16px">
      <h2><span class="no">A</span>批量分组（JSON）</h2>
      <label>粘贴 JSON 数组，每条为一个病例</label>
      <textarea id="batchJson" spellcheck="false"></textarea>
      <div class="actions">
        <button class="primary" id="btnBatch">批量分组</button>
        <button class="ghost" id="btnBatchSample">载入示例</button>
        <button class="ghost" id="btnBatchClear">清空结果</button>
        <span class="tip">单次最多 50000 条</span>
      </div>
    </div>

    <div class="card" id="csvDrop" style="margin-bottom:16px">
      <h2><span class="no">B</span>批量分组（CSV 文件）</h2>
      <div class="actions" style="margin-top:0">
        <button class="ghost" id="btnPickCsv" type="button">选择 CSV 文件</button>
        <input type="file" id="csvFile" accept=".csv,text/csv,application/vnd.ms-excel" style="display:none" />
        <button class="ghost" id="btnTemplate" type="button">下载 CSV 模板</button>
        <span class="tip">列名见模板；多条编码用英文分号分隔</span>
      </div>
      <div class="drop-hint">支持 Excel 另存的 CSV（UTF-8 或 GBK 均可），也可以把文件直接拖到这张卡片上</div>
      <div class="msg" id="csvStatus" style="display:none"></div>
    </div>

    <div class="card">
      <h2><span class="no">C</span>批量结果</h2>
      <div class="summary" id="batchSummary"></div>
      <div id="batchTable"><div class="placeholder">尚未执行批量分组</div></div>
      <div class="actions" id="batchActions" style="display:none">
        <button class="ghost" id="btnDownload">下载结果 CSV</button>
      </div>
    </div>
  </section>

  <div class="footer">CHS-DRG 3.0 本地分组器 · 仅用于分组试算，最终以医保经办机构分组结果为准</div>
</main>

<script>
(function () {
  "use strict";

  var DEFAULT_BASE = (location.protocol === "http:" || location.protocol === "https:") ? "" : "http://127.0.0.1:8765";
  var state = {
    base: localStorage.getItem("drg_api_base") || DEFAULT_BASE,
    gender: "",
    odx: [],
    oop: [],
    batchResults: []
  };

  function $(id) { return document.getElementById(id); }
  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function api(path) { return state.base.replace(/\/+$/, "") + path; }

  // ---------------- 服务状态 ----------------
  function setDot(cls, title) {
    var dot = $("dot");
    dot.className = "dot " + (cls || "");
    dot.title = title || "";
  }

  function ping() {
    setDot("", "检测中…");
    return fetch(api("/api/v1/health"), { method: "GET" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        setDot("ok", "服务正常");
        return data;
      })
      .catch(function (err) {
        setDot("bad", "无法连接");
        throw err;
      });
  }

  // ---------------- 编码联想 ----------------
  function attachSearch(input, dd, type, onPick) {
    var timer = null;
    var items = [];
    var active = -1;

    function hide() { dd.classList.remove("show"); active = -1; }
    function show() { dd.classList.add("show"); }

    function render() {
      if (!items.length) {
        dd.innerHTML = '<div class="empty">未找到匹配编码</div>';
        show();
        return;
      }
      dd.innerHTML = items.map(function (it, i) {
        return '<div class="item' + (i === active ? " hl" : "") + '" data-i="' + i + '">' +
          '<span class="code">' + esc(it.code) + "</span><span>" + esc(it.name) + "</span></div>";
      }).join("");
      show();
    }

    function query() {
      var text = input.value.trim();
      if (!text) { items = []; hide(); return; }
      fetch(api("/api/v1/codes/search?type=" + encodeURIComponent(type) + "&q=" + encodeURIComponent(text) + "&limit=20"))
        .then(function (r) { return r.json(); })
        .then(function (data) { items = (data && data.items) || []; active = items.length ? 0 : -1; render(); })
        .catch(function () { hide(); });
    }

    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(query, 220);
    });
    input.addEventListener("keydown", function (event) {
      if (!dd.classList.contains("show")) return;
      if (event.key === "ArrowDown") { active = Math.min(active + 1, items.length - 1); render(); event.preventDefault(); }
      else if (event.key === "ArrowUp") { active = Math.max(active - 1, 0); render(); event.preventDefault(); }
      else if (event.key === "Enter") {
        // 只对"主要诊断/主要手术"这类选择框用回车取第一条；
        // 其他诊断/手术输入框交给各自的回车处理（避免误取第一条结果）
        if (input.id.indexOf("Input") === -1 && items[active]) {
          onPick(items[active]); hide(); event.preventDefault();
        }
      } else if (event.key === "Escape") { hide(); }
    });
    dd.addEventListener("mousedown", function (event) {
      var node = event.target.closest(".item");
      if (!node) return;
      var it = items[Number(node.dataset.i)];
      if (it) { onPick(it); hide(); }
      event.preventDefault();
    });
    document.addEventListener("click", function (event) {
      if (!dd.contains(event.target) && event.target !== input) hide();
    });
  }

  function pickPrimary(prefix, item) {
    $(prefix + "Code").value = item.code;
    $(prefix + "Name").value = item.name;
  }

  function addOther(kind, item) {
    var list = kind === "odx" ? state.odx : state.oop;
    if (list.some(function (x) { return x.code === item.code; })) return;
    list.push({ code: item.code, name: item.name });
    renderChips(kind);
  }

  function renderChips(kind) {
    var list = kind === "odx" ? state.odx : state.oop;
    var box = $(kind + "Chips");
    box.innerHTML = list.map(function (it, i) {
      return '<span class="chip"><b>' + esc(it.code) + "</b>" + esc(it.name) +
        '<span class="x" data-kind="' + kind + '" data-i="' + i + '">×</span></span>';
    }).join("");
  }

  document.addEventListener("click", function (event) {
    var node = event.target.closest(".x");
    if (!node) return;
    var kind = node.dataset.kind;
    var list = kind === "odx" ? state.odx : state.oop;
    list.splice(Number(node.dataset.i), 1);
    renderChips(kind);
  });

  // ---------------- 单条分组 ----------------
  function buildRecord() {
    var age = $("age").value.trim();
    var weight = $("birthWeight").value.trim();
    var record = {
      patient_id: $("patientId").value.trim() || null,
      age: age === "" ? null : Number(age),
      age_unit: $("ageUnit").value,
      gender: state.gender || null,
      primary_diagnosis: {
        code: $("pdxCode").value.trim(),
        name: $("pdxName").value.trim()
      },
      other_diagnoses: state.odx.map(function (x) { return { code: x.code, name: x.name }; }),
      primary_operation: ($("popCode").value.trim() || $("popName").value.trim()) ? {
        code: $("popCode").value.trim(),
        name: $("popName").value.trim()
      } : null,
      other_operations: state.oop.map(function (x) { return { code: x.code, name: x.name }; })
    };
    if (weight !== "") record.birth_weight_g = Number(weight);
    return record;
  }

  function nodeRow(label, node) {
    if (!node) return '<div class="kv"><div class="k">' + label + '</div><div class="v">—</div></div>';
    return '<div class="kv"><div class="k">' + label + '</div><div class="v"><b>' +
      esc(node.code) + "</b>" + esc(node.name) + "</div></div>";
  }

  function renderResult(data) {
    var box = $("result");
    var g = data.grouping_result || {};
    var ok = !!data.is_grouped;
    var badge = ok
      ? '<span class="badge ok">已入组</span>'
      : (data.reason && data.reason.code === "AMBIGUOUS"
        ? '<span class="badge warn">歧义组</span>'
        : '<span class="badge bad">未入组</span>');

    var html = '<h2 style="justify-content:space-between;display:flex">' + badge +
      '<span style="font-size:12.5px;color:#8aa0ad">' + esc(g.patient_id || "无患者ID") + "</span></h2>";

    html += nodeRow("MDC", g.mdc);
    html += nodeRow("ADRG", g.adrg);
    html += nodeRow("DRG", g.drg);
    html += '<div class="kv"><div class="k">RW</div><div class="v"><b>' + esc(g.rw || "NAN") +
      '</b><span style="color:#8aa0ad;font-size:12.5px">暂无分值表，统一输出 NAN</span></div></div>';

    if (data.reason) {
      html += '<div class="msg ' + (data.reason.code === "AMBIGUOUS" ? "warn" : "bad") + '">' +
        "<b>" + esc(data.reason.code) + "</b>：" + esc(data.reason.message) + "</div>";
    }
    if (data.warnings && data.warnings.length) {
      html += '<div class="msg warn">' + data.warnings.map(esc).join("<br />") + "</div>";
    }
    if (data.diagnostics) {
      var d = data.diagnostics;
      html += "<details><summary>分组过程（调试）</summary>" +
        "<pre>" + esc(JSON.stringify({
          cc_status: d.cc_status,
          valid_mcc: d.valid_mcc,
          valid_cc: d.valid_cc,
          trace: d.trace,
          fields: d.fields,
          elapsed_ms: d.elapsed_ms
        }, null, 2)) + "</pre></details>";
    }
    box.innerHTML = html;
  }

  function group() {
    var btn = $("btnGroup");
    var record = buildRecord();
    if (!record.primary_diagnosis.code) { alert("请填写主要诊断编码"); return; }
    if (!record.gender) { alert("请选择性别"); return; }
    if (record.age === null) { alert("请填写年龄"); return; }

    btn.disabled = true;
    btn.textContent = "分组中…";
    var url = api("/api/v1/group" + ($("debug").checked ? "?debug=1" : ""));
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify(record)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok === false && data.error) {
          $("result").innerHTML = '<div class="msg bad"><b>' + esc(data.error.code) + "</b>：" +
            esc(data.error.message) + "</div>";
          return;
        }
        renderResult(data);
      })
      .catch(function (err) {
        $("result").innerHTML = '<div class="msg bad">无法连接分组服务：' + esc(err.message) +
          "<br />请先运行 start.bat；若浏览器拦截本地请求，请改用 http://127.0.0.1:8765/ 打开本页面。</div>";
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "开始分组";
      });
  }

  // ---------------- 批量 ----------------
  function renderBatch(data) {
    state.batchResults = (data && data.results) || [];
    var s = (data && data.summary) || {};
    $("batchSummary").innerHTML = "<span>共计 <b>" + (s.total || 0) + "</b> 条</span>" +
      "<span>已入组 <b>" + (s.grouped || 0) + "</b></span>" +
      "<span>未入组 <b>" + (s.not_grouped || 0) + "</b></span>" +
      "<span>耗时 <b>" + (s.elapsed_ms || 0) + "</b> ms</span>";

    if (!state.batchResults.length) {
      $("batchTable").innerHTML = '<div class="placeholder">没有结果</div>';
      $("batchActions").style.display = "none";
      return;
    }
    var rows = state.batchResults.map(function (item, i) {
      var g = item.grouping_result || {};
      var r = item.reason || {};
      return "<tr><td>" + (i + 1) + "</td><td>" + esc(g.patient_id || "") + "</td><td>" +
        (item.is_grouped ? '<span class="badge ok" style="padding:2px 8px">是</span>' : '<span class="badge bad" style="padding:2px 8px">否</span>') +
        "</td><td>" + (g.mdc ? esc(g.mdc.code) : "") + "</td><td>" +
        (g.adrg ? esc(g.adrg.code + " " + g.adrg.name) : "") + "</td><td>" +
        (g.drg ? esc(g.drg.code + " " + g.drg.name) : "") + "</td><td>" +
        esc(r.code || "") + "</td></tr>";
    }).join("");
    $("batchTable").innerHTML = "<table><thead><tr><th>#</th><th>患者ID</th><th>入组</th><th>MDC</th>" +
      "<th>ADRG</th><th>DRG</th><th>原因</th></tr></thead><tbody>" + rows + "</tbody></table>";
    $("batchActions").style.display = "flex";
  }

  function runBatch() {
    var text = $("batchJson").value.trim();
    var btn = $("btnBatch");
    var records;
    try { records = JSON.parse(text); } catch (e) {
      alert("JSON 解析失败：" + e.message); return;
    }
    if (!Array.isArray(records)) { alert("请提供 JSON 数组"); return; }
    btn.disabled = true; btn.textContent = "分组中…";
    fetch(api("/api/v1/group/batch"), {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify(records)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok === false && data.error) { alert(data.error.message); return; }
        renderBatch(data);
      })
      .catch(function (err) { alert("无法连接分组服务：" + err.message); })
      .finally(function () { btn.disabled = false; btn.textContent = "批量分组"; });
  }

  // ---------------- CSV 上传 / 下载 ----------------
  function formatBytes(n) {
    if (n === undefined || n === null) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  function setCsvStatus(kind, html) {
    var box = $("csvStatus");
    if (!box) return;
    box.className = "msg " + kind;
    box.innerHTML = html || "";
    box.style.display = html ? "block" : "none";
  }

  // Excel 另存的 CSV 编码不固定：先按 UTF-8（含 BOM）严格解码，失败再按 GB18030/GBK
  function decodeCsvBuffer(buffer) {
    var bytes = new Uint8Array(buffer);
    var hasBom = bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
    var order = hasBom ? ["utf-8"] : ["utf-8", "gb18030"];
    for (var i = 0; i < order.length; i++) {
      try {
        var text = new TextDecoder(order[i], { fatal: true }).decode(bytes);
        return {
          text: text,
          encoding: hasBom ? "UTF-8（带 BOM）" : (order[i] === "utf-8" ? "UTF-8" : "GB18030/GBK")
        };
      } catch (e) { /* 换下一种编码 */ }
    }
    return {
      text: new TextDecoder("utf-8").decode(bytes),
      encoding: "UTF-8（含无法识别字节，可能有乱码）"
    };
  }

  // 去掉 BOM、开头空行，以及 Excel 可能写入的 sep=, 行
  function normalizeCsvText(text) {
    text = String(text || "").replace(/^\uFEFF/, "");
    var lines = text.split(/\r\n|\n|\r/);
    while (lines.length && !lines[0].trim()) lines.shift();
    if (lines.length && /^sep\s*=/i.test(lines[0].trim())) lines.shift();
    return lines.join("\r\n");
  }

  function uploadCsv(file) {
    var btn = $("btnPickCsv");
    setCsvStatus("info", "正在读取 <b>" + esc(file.name) + "</b>（" + formatBytes(file.size) + "）…");
    if (btn) { btn.disabled = true; btn.textContent = "读取中…"; }

    var reader = new FileReader();
    reader.onerror = function () {
      setCsvStatus("bad", "读取文件失败：请确认文件没有被 Excel 等程序独占打开。");
    };
    reader.onload = function () {
      var decoded = decodeCsvBuffer(reader.result);
      var text = normalizeCsvText(decoded.text);
      var header = (text.split(/\r\n/)[0] || "").trim();
      if (!text.trim()) {
        setCsvStatus("bad", "文件内容为空（识别编码：" + decoded.encoding + "）。");
        return;
      }
      if (header.indexOf(",") === -1) {
        setCsvStatus(
          "bad",
          "首行没有逗号，可能不是逗号分隔的 CSV（识别编码：" + esc(decoded.encoding) +
          "）。请在 Excel 里用「另存为 → CSV（逗号分隔）」重新导出后上传。"
        );
        return;
      }
      setCsvStatus("info", "已读取（" + esc(decoded.encoding) + "，" + text.split(/\r\n/).length + " 行），正在分组…");
      return fetch(api("/api/v1/group/csv"), {
        method: "POST",
        headers: { "Content-Type": "text/csv; charset=utf-8" },
        body: text
      })
        .then(function (resp) {
          return resp.json().then(function (body) { return { status: resp.status, body: body }; });
        })
        .then(function (res) {
          if (!res.body || res.body.ok === false) {
            var err = (res.body && res.body.error) || {};
            throw new Error((err.code ? "[" + err.code + "] " : "") + (err.message || ("HTTP " + res.status)));
          }
          renderBatch(res.body);
          var s = res.body.summary || {};
          var msg = "分组完成：" + (s.total || 0) + " 条，入组 " + (s.grouped || 0) +
            " 条，未入组 " + (s.not_grouped || 0) + " 条，用时 " + (s.elapsed_ms || 0) +
            " ms（编码 " + esc(decoded.encoding) + "）";
          if ((s.total || 0) > 0 && (s.grouped || 0) === 0) {
            setCsvStatus("warn", msg + "<br />全部未入组：请检查表头是否与模板一致、诊断编码是否为 3.0 版编码。");
          } else {
            setCsvStatus("ok", msg);
          }
          var table = $("batchTable");
          if (table && table.scrollIntoView) {
            table.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        })
        .catch(function (err) {
          setCsvStatus("bad", "上传失败：" + esc(err.message));
        });
    };
    reader.onloadend = function () {
      if (btn) { btn.disabled = false; btn.textContent = "选择 CSV 文件"; }
    };
    reader.readAsArrayBuffer(file);
  }

  function downloadCsv() {
    if (!state.batchResults.length) {
      setCsvStatus("bad", "还没有可下载的结果，请先执行一次批量分组。");
      return;
    }
    var header = ["patient_id", "is_grouped", "mdc_code", "mdc_name", "adrg_code", "adrg_name", "drg_code", "drg_name", "rw", "reason_code", "reason_message"];
    var lines = [header.join(",")];
    state.batchResults.forEach(function (item) {
      var g = item.grouping_result || {};
      var r = item.reason || {};
      var row = [
        g.patient_id || "", item.is_grouped ? "true" : "false",
        g.mdc ? g.mdc.code : "", g.mdc ? g.mdc.name : "",
        g.adrg ? g.adrg.code : "", g.adrg ? g.adrg.name : "",
        g.drg ? g.drg.code : "", g.drg ? g.drg.name : "",
        g.rw || "NAN", r.code || "", r.message || ""
      ].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; });
      lines.push(row.join(","));
    });
    var now = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var name = "DRG分组结果_" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
      "_" + pad(now.getHours()) + pad(now.getMinutes()) + ".csv";
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    var fallback = '若浏览器没有自动下载，<a href="' + url + '" download="' + esc(name) + '">点此保存</a>';
    try {
      a.click();
      setCsvStatus("ok", "已生成 <b>" + esc(name) + "</b>（" + state.batchResults.length + " 条）。" + fallback);
    } catch (e) {
      setCsvStatus("bad", "自动下载失败：" + esc(e.message) + "。" + fallback);
    } finally {
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1000);
      // 保留链接 10 分钟，之后释放 Blob
      setTimeout(function () { URL.revokeObjectURL(url); }, 600000);
    }
  }

  // ---------------- 示例 ----------------
  var SAMPLE = {
    patient_id: "345899002",
    age: 65,
    age_unit: "years",
    gender: "M",
    primary_diagnosis: { code: "I63.900", name: "脑梗死" },
    other_diagnoses: [
      { code: "E11.900", name: "2型糖尿病" },
      { code: "I10.000", name: "高血压病" },
      { code: "J96.000", name: "急性呼吸衰竭" }
    ],
    primary_operation: { code: "38.1201", name: "颈动脉内膜剥脱术" },
    other_operations: [
      { code: "88.4100", name: "脑血管造影" },
      { code: "96.7201", name: "有创呼吸机支持治疗" }
    ]
  };

  function fillSample() {
    state.gender = "M";
    document.querySelectorAll("#genderSeg button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.g === "M");
    });
    $("patientId").value = SAMPLE.patient_id;
    $("age").value = SAMPLE.age;
    $("ageUnit").value = SAMPLE.age_unit;
    $("birthWeight").value = "";
    $("pdxCode").value = SAMPLE.primary_diagnosis.code;
    $("pdxName").value = SAMPLE.primary_diagnosis.name;
    $("popCode").value = SAMPLE.primary_operation.code;
    $("popName").value = SAMPLE.primary_operation.name;
    state.odx = SAMPLE.other_diagnoses.slice();
    state.oop = SAMPLE.other_operations.slice();
    renderChips("odx"); renderChips("oop");
  }

  function clearAll() {
    state.gender = ""; state.odx = []; state.oop = [];
    document.querySelectorAll("#genderSeg button").forEach(function (b) { b.classList.remove("active"); });
    ["patientId", "age", "birthWeight", "pdxCode", "pdxName", "popCode", "popName", "odxInput", "oopInput"].forEach(function (id) { $(id).value = ""; });
    $("ageUnit").value = "years";
    renderChips("odx"); renderChips("oop");
    $("result").innerHTML = '<div class="placeholder">填写左侧病例信息后点击「开始分组」<br />分组在本机完成，不会上传任何数据</div>';
  }

  // ---------------- 事件绑定 ----------------
  $("apiBase").value = state.base;
  $("apiBase").addEventListener("change", function () {
    state.base = this.value.trim();
    localStorage.setItem("drg_api_base", state.base);
    ping().catch(function () {});
  });
  $("btnPing").addEventListener("click", function () {
    ping().then(function (data) { alert("服务正常：" + data.app + " v" + data.version); })
      .catch(function () { alert("无法连接 " + api("/api/v1/health") + "\n请先运行 start.bat 启动分组服务。"); });
  });

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
      tab.classList.add("active");
      $("panel-" + tab.dataset.panel).classList.add("active");
    });
  });

  document.querySelectorAll("#genderSeg button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.gender = btn.dataset.g;
      document.querySelectorAll("#genderSeg button").forEach(function (b) { b.classList.toggle("active", b === btn); });
    });
  });

  attachSearch($("pdxCode"), $("pdxDD"), "dx", function (it) { pickPrimary("pdx", it); });
  attachSearch($("pdxName"), $("pdxDD"), "dx", function (it) { pickPrimary("pdx", it); });
  attachSearch($("odxInput"), $("odxDD"), "dx", function (it) { addOther("odx", it); });
  attachSearch($("popCode"), $("popDD"), "op", function (it) { pickPrimary("pop", it); });
  attachSearch($("popName"), $("popDD"), "op", function (it) { pickPrimary("pop", it); });
  attachSearch($("oopInput"), $("oopDD"), "op", function (it) { addOther("oop", it); });

  ["odxInput", "oopInput"].forEach(function (id) {
    $(id).addEventListener("keydown", function (event) {
      if (event.key === "Enter" && this.value.trim()) {
        var type = id === "odxInput" ? "dx" : "op";
        var q = this.value.trim();
        fetch(api("/api/v1/codes/search?type=" + type + "&q=" + encodeURIComponent(q) + "&limit=1"))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.items && data.items[0]) { addOther(id === "odxInput" ? "odx" : "oop", data.items[0]); }
            else { addOther(id === "odxInput" ? "odx" : "oop", { code: q, name: "" }); }
            $(id).value = "";
          });
      }
    });
  });

  $("btnGroup").addEventListener("click", group);
  $("btnSample").addEventListener("click", fillSample);
  $("btnClear").addEventListener("click", clearAll);

  $("batchJson").value = JSON.stringify([SAMPLE, {
    patient_id: "B001", age: 30, age_unit: "years", gender: "F",
    primary_diagnosis: { code: "K35.800x001", name: "急性阑尾炎" },
    primary_operation: { code: "47.0901", name: "阑尾切除术" }
  }, {
    patient_id: "C001", age: 5, age_unit: "days", gender: "M",
    primary_diagnosis: { code: "P07.200", name: "早产" }
  }], null, 2);

  $("btnBatch").addEventListener("click", runBatch);
  $("btnBatchSample").addEventListener("click", function () {
    $("batchJson").value = JSON.stringify([SAMPLE], null, 2);
  });
  $("btnBatchClear").addEventListener("click", function () {
    state.batchResults = [];
    $("batchSummary").innerHTML = "";
    $("batchTable").innerHTML = '<div class="placeholder">尚未执行批量分组</div>';
    $("batchActions").style.display = "none";
  });
  $("btnDownload").addEventListener("click", downloadCsv);
  $("btnTemplate").addEventListener("click", function () { window.open(api("/api/v1/template/csv"), "_blank"); });
  $("btnPickCsv").addEventListener("click", function () { $("csvFile").click(); });
  $("csvFile").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = ""; // 允许重复选择同一个文件
    if (file) uploadCsv(file);
  });

  // 拖拽上传：整张「CSV 文件」卡片都是投放区
  (function bindCsvDrop() {
    var zone = $("csvDrop");
    if (!zone) return;
    var depth = 0;
    ["dragenter", "dragover"].forEach(function (evt) {
      zone.addEventListener(evt, function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (evt === "dragenter") depth++;
        zone.classList.add("drop-on");
      });
    });
    zone.addEventListener("dragleave", function (e) {
      e.preventDefault();
      depth = Math.max(0, depth - 1);
      if (!depth) zone.classList.remove("drop-on");
    });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      e.stopPropagation();
      depth = 0;
      zone.classList.remove("drop-on");
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      if (!/\.csv$/i.test(file.name)) {
        setCsvStatus("bad", "只支持 .csv 文件，请先把 Excel 另存为 CSV 再拖入。");
        return;
      }
      uploadCsv(file);
    });
  })();

  // 防止把文件拖到卡片外时，浏览器直接打开这个 CSV
  ["dragover", "drop"].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      var types = e.dataTransfer && e.dataTransfer.types;
      var hasFile = false;
      if (types) {
        for (var i = 0; i < types.length; i++) {
          if (types[i] === "Files") { hasFile = true; break; }
        }
      }
      if (hasFile) e.preventDefault();
    });
  });

  // 启动时探测服务
  ping().then(function () { $("apiBase").value = state.base; }).catch(function () {});
})();
</script>
